name: Build AERA Recovery for tb323fu

on:
  push:
    branches: [ main ]
    paths:
      - 'device/lenovo/tb323fu/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    # 机器资源设定保持原样：4 核 / 16GB 免费 runner，不清洗
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4

    # 原第 2 步「Download prebuilt binaries from Release」已删除：
    # 本设备树自带 prebuilt/kernel（39MB，md5 e3e00158eb5b842270c37322780709ba，与原厂 boot.img 内核一致）
    # 与 22 个内核模块（recovery/root/lib/modules/），不再拉别人那份 23.6MB 包，
    # 也避免它覆盖我们的模块清单（它那份 309 个 ko 缺 qca_cld3_wcn7750）。

    - name: Free disk space
      run: |
        echo "=== Before cleanup ==="
        df -h /
        # 清理不需要的大文件，释放根分区空间
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/share/miniconda
        sudo rm -rf /usr/local/julia*
        sudo rm -rf /usr/local/rustup
        sudo rm -rf /usr/local/go
        sudo rm -rf /usr/share/kotlin
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/share/lua*
        sudo rm -rf /usr/local/bundle
        sudo rm -rf /opt/az
        sudo rm -rf /usr/share/az*
        sudo docker image prune --all --force || true
        sudo docker system prune --all --force --volumes || true
        echo "=== After cleanup ==="
        df -h /

    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y git gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          openjdk-17-jdk python3 python3-pip rsync python3-protobuf lz4
        sudo apt clean
        sudo rm -rf /var/lib/apt/lists/*

    - name: Create swap space
      run: |
        free -h
        df -h /
        sudo dd if=/dev/zero of=/mnt/swapfile_extra bs=1M count=16384 status=none
        sudo chmod 600 /mnt/swapfile_extra
        sudo mkswap /mnt/swapfile_extra
        sudo swapon /mnt/swapfile_extra
        free -h
        df -h /

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git config --global user.email "builder@github.com"
        git config --global user.name "GitHub Actions"

    - name: Sync AERA source (on /mnt big volume)
      run: |
        # 源码同步到 /mnt 大卷，不占根分区
        sudo mkdir -p /mnt/work
        sudo chown $USER:$USER /mnt/work
        cd /mnt/work
        repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0 --depth=1
        mkdir -p .repo/local_manifests
        # 用 AERA 官方 remove-minimal.xml（删 601 项）。
        # 仓库自带 remove-minimal2.xml 会把 system/netd 一起删掉，
        # dnsresolver_aidl_interface 缺 netd_event_listener_interface，ninja 在 29% 炸，不能用。
        curl -sL https://raw.githubusercontent.com/AERA-Recovery/android_manifest/aera-16.0/remove-minimal.xml \
          -o .repo/local_manifests/remove-minimal.xml
        set -o pipefail
        for i in $(seq 1 2000); do
          echo "=== sync attempt $i ==="
          if repo sync -c --force-sync --no-clone-bundle --no-tags -j8 > /tmp/sync.log 2>&1; then
            echo "=== sync OK ==="
            break
          fi
          bad=$(grep -oP 'remove-project (path|name)="[^"]*"' /tmp/sync.log | head -1 | sed 's/remove-project [a-z]*="//;s/"//')
          if [ -z "$bad" ]; then
            echo "=== sync failed, no remove-project error ==="
            tail -40 /tmp/sync.log
            exit 1
          fi
          echo "=== removing non-existent: $bad ==="
          sed -i "\|\"$bad\"|d" .repo/local_manifests/remove-minimal.xml
        done
        find /mnt/work -name .git -type d -prune -exec rm -rf {} + 2>/dev/null || true
        df -h /

    - name: Copy device tree
      run: |
        mkdir -p /mnt/work/device/lenovo/tb323fu
        cp -r device/lenovo/tb323fu/* /mnt/work/device/lenovo/tb323fu/
        echo "设备树文件数: $(find /mnt/work/device/lenovo/tb323fu -type f | wc -l)"
        ls -la /mnt/work/device/lenovo/tb323fu | head

    - name: Build recovery
      run: |
        cd /mnt/work
        free -h
        df -h / /mnt
        set -o pipefail
        source build/envsetup.sh
        lunch twrp_tb323fu-bp2a-eng
        export SOONG_UI_MEMORY=4G
        export GOMAXPROCS=2
        export ANDROID_JAVA_OPTS="-Xmx4g -Xms1g"
        export GOMEMLIMIT=12GiB
        export GOGC=50
        mka adbd recoveryimage -j2 2>&1 | tee /tmp/build.log

    - name: Upload recovery image
      uses: actions/upload-artifact@v4
      with:
        name: tb323fu-recovery-img
        path: /mnt/work/out/target/product/tb323fu/recovery.img
        retention-days: 7
        if-no-files-found: error

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /tmp/build.log
        retention-days: 3
