name: Build AERA Recovery for tb323fu

on:
  push:
    branches: [ main ]
    paths:
      - 'device/lenovo/tb323fu/**'
      - 'ci/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 机器资源设定保持原样：4 核 / 16GB 免费 runner，不清洗
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4

    # 设备树已换成本地复核查验版本（prebuilt/kernel 39.9MB，md5 2c6bc3464ff61f35e2d5a83f1a6302ff；
    # recovery/root 不再预置 vendor .ko，运行时从真机 vendor_dlkm / system_dlkm / vendor_boot 加载）。

    - name: Free disk space
      run: |
        echo "=== Before cleanup ==="
        df -h /
        # 清理不需要的大文件，释放根分区空间
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/share/miniconda
        sudo rm -rf /usr/local/julia*
        sudo rm -rf /usr/local/rustup
        sudo rm -rf /usr/local/go
        sudo rm -rf /usr/share/kotlin
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/share/lua*
        sudo rm -rf /usr/local/bundle
        sudo rm -rf /opt/az
        sudo rm -rf /usr/share/az*
        sudo docker image prune --all --force || true
        sudo docker system prune --all --force --volumes || true
        echo "=== After cleanup ==="
        df -h /

    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y git gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          openjdk-17-jdk python3 python3-pip rsync python3-protobuf lz4
        sudo apt clean
        sudo rm -rf /var/lib/apt/lists/*

    - name: Create swap space
      run: |
        free -h
        df -h /
        sudo dd if=/dev/zero of=/mnt/swapfile_extra bs=1M count=16384 status=none
        sudo chmod 600 /mnt/swapfile_extra
        sudo mkswap /mnt/swapfile_extra
        sudo swapon /mnt/swapfile_extra
        free -h
        df -h /

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git config --global user.email "builder@github.com"
        git config --global user.name "GitHub Actions"

    - name: Sync AERA source (on /mnt big volume)
      run: |
        # 源码同步到 /mnt 大卷，不占根分区
        sudo mkdir -p /mnt/work
        sudo chown $USER:$USER /mnt/work
        cd /mnt/work
        repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0 --depth=1
        mkdir -p .repo/local_manifests
        # AERA's twrp-default.xml already includes remove-minimal.xml.  Copying
        # it again as a local manifest duplicates all 601 remove-project
        # entries and makes repo reject every one of them; the old retry loop
        # then deleted the local copy line by line, which looked like source
        # projects were being removed.  Only overlay the two source forks.
        cp "$GITHUB_WORKSPACE/ci/tb323fu-sources.xml" .repo/local_manifests/tb323fu-sources.xml
        xmllint --noout .repo/local_manifests/tb323fu-sources.xml
        set -o pipefail
        for i in $(seq 1 3); do
          echo "=== sync attempt $i ==="
          set +e
          timeout 75m repo sync -c --force-sync --no-clone-bundle --no-tags -j8 > /tmp/sync.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "=== sync OK ==="
            break
          fi
          if [ "$rc" -eq 124 ]; then
            echo "=== sync timeout after 75m, retry ==="
            sleep 10
            continue
          fi
          echo "=== sync failed ==="
          tail -40 /tmp/sync.log
          exit 1
        done
        find /mnt/work -name .git -type d -prune -exec rm -rf {} + 2>/dev/null || true
        df -h /

    - name: Allow 16.0.0 in CTS platform releases
      run: |
        FILE=/mnt/work/cts/tests/tests/os/assets/platform_releases.txt
        test -f "$FILE"
        grep -qxF '16.0.0' "$FILE" || sed -i '$a 16.0.0' "$FILE"
        grep -qxF '16.0.0' "$FILE"
        tail -3 "$FILE"

    - name: Copy device tree
      run: |
        mkdir -p /mnt/work/device/lenovo/tb323fu
        cp -a device/lenovo/tb323fu/. /mnt/work/device/lenovo/tb323fu/
        test -f /mnt/work/device/lenovo/tb323fu/AndroidProducts.mk
        test -f /mnt/work/device/lenovo/tb323fu/prebuilt/kernel
        echo "设备树文件数: $(find /mnt/work/device/lenovo/tb323fu -type f | wc -l)"
        echo "recovery/root 下 .ko 数: $(find /mnt/work/device/lenovo/tb323fu/recovery/root -name '*.ko' | wc -l)"
        ls -la /mnt/work/device/lenovo/tb323fu | head

    - name: Verify source-level TB323FU fixes
      run: |
        test -z "$(find /mnt/work/device/lenovo/tb323fu/recovery/root -name '*.ko' -print -quit)" || { echo "recovery/root 仍含 .ko，拒绝构建"; exit 1; }
        # 官方 AERA recovery 源码已能编译并解锁；这里只要求振动 fallback
        # 已进入 bootable/recovery，不再校验旧的 tb323fu-decrypt 解密定制。
        grep -q 'dual_activate' /mnt/work/bootable/recovery/minuitwrp/events.cpp || { echo "振动 dual sysfs fallback 不在源码"; exit 1; }

    - name: Apply vold clone-profile unlock patch
      run: |
        PATCH="$GITHUB_WORKSPACE/ci/vold-clone-unlock.patch"
        test -f "$PATCH" || { echo "缺少 vold clone-profile 补丁"; exit 1; }
        cd /mnt/work/system/vold
        patch -p1 --dry-run < "$PATCH"
        patch -p1 < "$PATCH"
        grep -q 'Decrypt_Tied_Profile' Decrypt.cpp || { echo "vold 补丁未生效"; exit 1; }

    - name: Build recovery
      run: |
        cd /mnt/work
        free -h
        df -h / /mnt
        set -o pipefail
        source build/envsetup.sh
        export AERA_BUILD_DEVICE=tb323fu
        lunch twrp_tb323fu-bp2a-eng
        echo "=== build start ==="; df -h /; free -h
        ( while true; do echo "$(date -u +%H:%M:%S) $(df -h / | tail -1) | $(free -m | awk '/Mem:/{print "mem used "$3"M avail "$7"M"}') | $(free -m | awk '/Swap:/{print "swap used "$3"M"}')"; sleep 180; done ) > /tmp/resmon.log 2>&1 &
        MON=$!
        export SOONG_UI_MEMORY=4G
        export GOMAXPROCS=2
        export ANDROID_JAVA_OPTS="-Xmx4g -Xms1g"
        export GOMEMLIMIT=12GiB
        export GOGC=50
        rm -rf /tmp/statusrepo
        git clone --depth=1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/statusrepo >/dev/null 2>&1 || true
        ( while true; do
            { echo "== $(date -u) =="; df -h / | tail -1; free -m | awk '/Mem:/{print "mem used "$3"M avail "$7"M"}'; free -m | awk '/Swap:/{print "swap used "$3"M"}'; echo "--- ninja ---"; tail -c 1500 /tmp/build.log 2>/dev/null; } > /tmp/status.txt
            if [ -d /tmp/statusrepo/.git ]; then
              cp /tmp/status.txt /tmp/statusrepo/CI_STATUS.txt
              cd /tmp/statusrepo && git -c user.email=ci@local -c user.name=ci commit -qam "status $(date -u +%H:%M)" && git push -q origin HEAD:ci-status --force; cd /mnt/work
            fi
            sleep 240
          done ) >/dev/null 2>&1 &
        STATUS=$!
        mka adbd recoveryimage -j4 2>&1 | tee /tmp/build.log
        rc=${PIPESTATUS[0]}
        kill $MON $STATUS 2>/dev/null || true
        echo "=== build end rc=$rc ==="; df -h /; free -h
        exit $rc

    - name: Verify kernel-less recovery image
      run: |
        IMG=/mnt/work/out/target/product/tb323fu/recovery.img
        test -s "$IMG"
        python3 - "$IMG" <<'PY'
        import struct, sys
        path = sys.argv[1]
        with open(path, "rb") as f:
            header = f.read(4096)
        if header[:8] != b"ANDROID!":
            raise SystemExit("not an Android boot image: %s" % path)
        kernel_size = struct.unpack_from("<I", header, 8)[0]
        print("recovery.img kernel_size =", kernel_size)
        if kernel_size != 0:
            raise SystemExit("kernel_size is not 0; recovery is not kernel-less")
        PY

    - name: Upload recovery image
      uses: actions/upload-artifact@v4
      with:
        name: tb323fu-recovery-img
        path: /mnt/work/out/target/product/tb323fu/recovery.img
        retention-days: 7
        if-no-files-found: error

    - name: Upload resource monitor
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: resource-monitor
        path: /tmp/resmon.log
        retention-days: 3
        if-no-files-found: ignore

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /tmp/build.log
        retention-days: 3
